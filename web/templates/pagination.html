{{define "pagination.html"}}
{{$info := .PageInfo}}
{{$search := .Search}}
{{$label := .Label}}
{{if gt $info.TotalPages 1}}
<div class="pagination">
    <a href="?page={{sub $info.Current 1}}&perPage={{$info.PerPage}}{{if $search}}&search={{$search | urlquery}}{{end}}" class="btn btn-sm btn-secondary{{if eq $info.Current 1}} disabled{{end}}">← Previous</a>
    <span class="page-info">Page {{$info.Current}} / {{$info.TotalPages}} ({{$info.Total}} {{$label}})</span>
    <a href="?page={{add $info.Current 1}}&perPage={{$info.PerPage}}{{if $search}}&search={{$search | urlquery}}{{end}}" class="btn btn-sm btn-secondary{{if eq $info.Current $info.TotalPages}} disabled{{end}}">Next →</a>
    <select class="per-page-select" onchange="var s=document.querySelector('input[name=search]');var q='?perPage='+this.value;if(s&&s.value)q+='&search='+encodeURIComponent(s.value);window.location.href=q">
        <option value="10" {{if eq $info.PerPage 10}}selected{{end}}>10</option>
        <option value="20" {{if eq $info.PerPage 20}}selected{{end}}>20</option>
        <option value="30" {{if eq $info.PerPage 30}}selected{{end}}>30</option>
        <option value="40" {{if eq $info.PerPage 40}}selected{{end}}>40</option>
        <option value="50" {{if eq $info.PerPage 50}}selected{{end}}>50</option>
        <option value="0" {{if eq $info.PerPage 0}}selected{{end}}>All</option>
    </select>
</div>
{{end}}

</div>
{{end}}
