<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{assetVersion}}">
    <script src="/static/js/theme.js?v={{assetVersion}}"></script>
</head>
<body class="login-page">
    <button class="theme-toggle theme-toggle-fixed" data-action="toggle-theme" title="Toggle theme" aria-label="Toggle theme"></button>
    <div class="login-container">
        <div class="login-box">
            <h1>{{.AppName}}</h1>
            <p class="subtitle">PowerDNS Administration</p>
            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}
            {{if .OIDCProviders}}
            <div class="sso-providers">
                {{range .OIDCProviders}}
                <a class="btn btn-secondary btn-block sso-btn sso-btn-{{.Icon}}" href="/auth/oidc/{{.Name}}/login">
                    Sign in with {{.DisplayName}}
                </a>
                {{end}}
            </div>
            {{if not .HideLocalLogin}}<div class="sso-divider"><span>or</span></div>{{end}}
            {{end}}
            {{if not .HideLocalLogin}}
            <form method="POST" action="/login">
                <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            {{end}}
        </div>
    </div>
    <script src="/static/js/app.js?v={{assetVersion}}"></script>
</body>
</html>
