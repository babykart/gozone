<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{assetVersion}}">
</head>
<body>
    <button class="theme-toggle theme-toggle-fixed" data-action="toggle-theme" title="Toggle theme" aria-label="Toggle theme"></button>
    <main class="container mt-4 text-center">
        <h1>Error</h1>
        <div class="alert alert-error error-box">
            {{.Message}}
        </div>
        <a href="{{.BackURL}}" class="btn btn-primary">Go Back</a>
    </main>
    <script src="/static/js/app.js?v={{assetVersion}}"></script>
</body>
</html>
