{{define "record_create.html"}}
{{template "app_layout_start" .}}
<div class="page-header">
    <div>
        <a href="/zones" class="breadcrumb">Zones</a> / <a href="/zones/{{.Zone.ID}}" class="breadcrumb">{{.Zone.Name}}</a> / <h2>Add Records</h2>
    </div>
</div>

<form method="POST" action="/zones/{{.Zone.ID}}/records/batch-create" class="card" id="batch-form">
    <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

    <div id="record-rows">
        <div class="record-row record-row-box">
            <div class="form-row">
                <div class="form-group">
                    <label for="rec-name-0">Name</label>
                    <input type="text" id="rec-name-0" name="name" placeholder="www" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="rec-type-0">Type</label>
                    <select name="type" id="rec-type-0" class="form-control" data-action="toggle-priority" required>
                        {{range .RecordTypes}}
                        <option value="{{.}}">{{.}}</option>
                        {{end}}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="rec-content-0">Content</label>
                    <input type="text" id="rec-content-0" name="content" placeholder="192.168.1.1" class="form-control" required>
                </div>
                <div class="form-group flex-5rem">
                    <label for="rec-ttl-0">TTL</label>
                    <input type="number" id="rec-ttl-0" name="ttl" value="" min="0" placeholder="3600" class="form-control" title="Leave empty to keep the current TTL when adding to an existing record set; 3600 for a new one">
                </div>
                <div class="form-group record-prio-group hidden">
                    <label for="rec-priority-0">Prio</label>
                    <input type="number" id="rec-priority-0" name="priority" value="0" min="0" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label for="rec-comment-0">Comment <span class="field-hint">(optional, one per line)</span></label>
                <textarea name="comment" id="rec-comment-0" rows="2" class="form-control" placeholder="e.g. managed by ops-team"></textarea>
                <label class="checkbox-inline mt-0-5 d-block">
                    <input type="checkbox" name="comment_clear" value="1">
                    Clear all comments <span class="field-hint">(only applies when the RRSet already exists)</span>
                </label>
            </div>
        </div>
    </div>

    <div class="mb-1">
        <button type="button" class="btn btn-secondary" data-action="add-record-row">+ Add another record</button>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Records</button>
        <a href="/zones/{{.Zone.ID}}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{{template "app_layout_end" .}}
{{end}}
