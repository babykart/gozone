{{define "record_create.html"}}
{{template "app_layout_start" .}}
<div class="page-header">
    <div>
        <a href="/zones" class="breadcrumb">Zones</a> / <a href="/zones/{{.Zone.ID}}" class="breadcrumb">{{.Zone.Name}}</a> / <h2>Add Records</h2>
    </div>
</div>

<form method="POST" action="/zones/{{.Zone.ID}}/records/batch-create" class="card" id="batch-form">
    <input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">

    <div id="record-rows">
        <div class="record-row" style="border:1px solid var(--border);border-radius:6px;padding:1rem;margin-bottom:0.75rem">
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="www" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="type" class="form-control" data-action="toggle-priority" required>
                        {{range .RecordTypes}}
                        <option value="{{.}}">{{.}}</option>
                        {{end}}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1">
                    <label>Content</label>
                    <input type="text" name="content" placeholder="192.168.1.1" class="form-control" required>
                </div>
                <div class="form-group" style="flex:0 0 5rem">
                    <label>TTL</label>
                    <input type="number" name="ttl" value="3600" min="0" class="form-control">
                </div>
                <div class="form-group record-prio-group" style="display:none;flex:0 0 6rem">
                    <label>Prio</label>
                    <input type="number" name="priority" value="0" min="0" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>Comment <span class="field-hint">(optional, one per line)</span></label>
                <textarea name="comment" rows="2" class="form-control" placeholder="e.g. managed by ops-team"></textarea>
                <label class="checkbox-inline" style="margin-top:0.5rem;display:block">
                    <input type="checkbox" name="comment_clear" value="1">
                    Clear all comments <span class="field-hint">(only applies when the RRSet already exists)</span>
                </label>
            </div>
        </div>
    </div>

    <div style="margin-bottom:1rem">
        <button type="button" class="btn btn-secondary" data-action="add-record-row">+ Add another record</button>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Records</button>
        <a href="/zones/{{.Zone.ID}}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{{template "app_layout_end" .}}
{{end}}
