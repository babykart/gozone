# gozone - PowerDNS Admin Interface Configuration
#
# Database driver choices:
#   sqlite3    - Local SQLite file (default, recommended for development)
#   mysql      - MySQL/MariaDB (production)
#   postgres   - PostgreSQL (production)
#
# Example DSNs:
#   sqlite3:  "./data/gozone.db"
#   mysql:    "user:password@tcp(localhost:3306)/gozone"
#   postgres: "host=localhost port=5432 user=gozone password=secret dbname=gozone sslmode=disable"

server:
  host: "0.0.0.0"
  port: 8080
  # Application name displayed in the web UI, page titles, and login page.
  # Defaults to "GoZone" if unset.
  app_name: "GoZone"
  # Placeholder: left as-is, a random key is auto-generated at startup (and
  # changes on every restart). Set a persistent value here or via
  # GOZONE_SECRET_KEY in production. Generate one with: openssl rand -hex 32
  secret_key: "change-me-to-a-random-secret-key"
  # Set to true when serving over HTTPS (directly or behind a TLS-terminating
  # reverse proxy) so the CSRF cookie gets the Secure flag. Keep false for
  # plain-HTTP development.
  secure_cookies: false
  # Maximum time (in seconds) to wait for in-flight requests to finish
  # during graceful shutdown (SIGINT/SIGTERM). Default: 30.
  shutdown_timeout_seconds: 30
  # Trusted reverse-proxy CIDR ranges from which X-Forwarded-For headers are
  # honored. Each entry MUST be a CIDR prefix — use "/32" for a single IPv4
  # host ("192.0.2.1/32") and "/128" for a single IPv6 host ("2001:db8::1/128").
  # Plain IPs without a prefix (e.g. "192.0.2.1") are rejected at startup
  # because chi's ClientIPFromXFF calls netip.MustParsePrefix which panics on
  # entries without a "/". Leave empty (the default) when GoZone is reachable
  # directly on the public Internet — the rate limiter then keys off the raw
  # TCP source address and cannot be bypassed by forging XFF headers.
  # trusted_proxies: []

database:
  driver: "sqlite3"
  dsn: "./data/gozone.db"

powerdns:
  api_url: "http://localhost:8081"
  api_key: "changeme"
  server_id: "localhost"

auth:
  session_duration_hours: 24
  bcrypt_cost: 12

# Password policy. Enforced whenever a password is set or changed (user
# creation, admin user update, `gozone user reset-password`). The initial
# admin seed is exempt (it is a one-time bootstrap that warns to be changed).
# Defaults below are secure-by-default; relax them here or via GOZONE_PASSWORD_*
# env vars. history_size retains that many previous hashes per user to prevent
# reuse (0 disables; the current password always counts as "used").
# max_age_days is the password lifetime in days (0 = no expiry, the default);
# when a password expires the user is forced to change it on next login, and
# expiry_warn_days shows a dashboard warning that many days before expiry.
# Note: any admin/operator password reset AND user creation set
# must_change_password, forcing the user to pick their own on next login.
password:
  min_length: 8
  require_uppercase: true
  require_lowercase: true
  require_digit: true
  require_special: true
  history_size: 0
  max_age_days: 0
  expiry_warn_days: 0

# Login brute-force protection. /login is always protected by an in-memory
# per-IP rate limiter (5/min). The two knobs below add defence-in-depth:
#   - username_rate_limit_per_minute: an in-memory per-username limiter,
#     compounded with the per-IP one at the route level (both must allow).
#   - max_failed_attempts / lockout_duration_minutes: persistent per-account
#     lockout that survives restarts and is shared across cluster instances.
#     Set max_failed_attempts to 0 to disable the feature entirely: no new
#     locks are recorded AND existing ones stop being enforced at login (a
#     previously locked account can log in again). To clear a single lock
#     without disabling the feature, use the admin Unlock action or
#     `gozone user unlock <id|username>`.
login_lock:
  max_failed_attempts: 10
  lockout_duration_minutes: 15
  username_rate_limit_per_minute: 5
  attempts_retention_hours: 24

logging:
  level: "info"

# Activity log retention. Logs older than retention_days are automatically
# purged once per day by a background job. Set retention_days to 0 to keep
# logs indefinitely. batch_size controls how many rows are deleted per pass.
activity:
  retention_days: 90
  batch_size: 1000

admin:
  username: "admin"
  password: "admin"
  email: "admin@gozone.local"
  first_name: "Admin"
  last_name: "User"

# OpenID Connect / OAuth2 single sign-on. Disabled by default. When enabled,
# "Sign in with <provider>" buttons appear on the login page. The flow is the
# authorization-code flow with PKCE (S256), a signed state parameter (CSRF) and
# a nonce (ID-token replay protection).
#
# Each provider is discovered via its issuer_url
# (/.well-known/openid-configuration). Known provider names (gitea, google,
# github, gitlab, keycloak, authentik, azure) supply default display names and
# scopes; any other name is treated as a generic OIDC provider.
#
# Override everything via GOZONE_OIDC_* env vars; a single provider can be
# declared entirely from env (GOZONE_OIDC_PROVIDER_NAME / _ISSUER_URL /
# _CLIENT_ID / _CLIENT_SECRET) without this file.
oidc:
  enabled: false
  # Keep the local username/password form alongside SSO buttons.
  allow_local_login: true
  # Auto-create a local user on first successful SSO login.
  auto_provision: false
  # Role assigned to auto-provisioned users (admin|user).
  default_role: "user"
  # Global fallback scopes when a provider declares none. "openid" is always
  # added and deduplicated.
  scopes: ["openid", "profile", "email"]
  providers: []
  # Example: Gitea as an OIDC identity provider.
  # providers:
  #   - name: gitea
  #     issuer_url: "https://gitea.example.com"
  #     client_id: "gozone"
  #     client_secret: "changeme"
  #     # display_name: "Gitea"   # optional override
  #     # scopes: ["openid", "profile", "email", "groups"]  # optional override
