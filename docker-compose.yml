services:
  gozone:
    build: .
    ports:
      - "8080:8080"
    environment:
      # ---------------------------------------------------------------------
      # WARNING: these are INSECURE placeholders for local development only.
      # NEVER deploy them to production as-is. Rotate before any real use.
      # See README.md -> "Secret Key" for hardening guidance.
      #   GOZONE_SECRET_KEY     -> openssl rand -hex 32
      #   GOZONE_ADMIN_PASSWORD -> a strong, unique password (or unset it and
      #                            run: gozone user reset-password admin)
      #   GOZONE_PDNS_API_KEY   -> must match PDNS_api_key below; rotate both
      # ---------------------------------------------------------------------
      - GOZONE_SECRET_KEY=change-me-to-a-random-secret-in-production
      - GOZONE_ADMIN_PASSWORD=admin
      - GOZONE_PDNS_API_URL=http://powerdns:8081
      - GOZONE_PDNS_API_KEY=changeme
    volumes:
      - gozone_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  powerdns:
    # Pinned by immutable digest for reproducible builds (c12). To update,
    # `docker pull powerdns/pdns-auth-master:latest` and replace the digest via
    # `docker image inspect --format '{{index .RepoDigests 0}}' powerdns/pdns-auth-master:latest`.
    image: powerdns/pdns-auth-master@sha256:5f1fe53a69e1e503a0ecaa12baf76462209b1bb567f3cc414675f76be9347dfb
    ports:
      - "53:53"
      - "53:53/udp"
    environment:
      - PDNS_auth_api=yes
      # WARNING: must match GOZONE_PDNS_API_KEY above; rotate both in production.
      - PDNS_api_key=changeme
      - PDNS_webserver=yes
      - PDNS_webserver_address=0.0.0.0
      - PDNS_webserver_allow_from=172.16.0.0/12
      - PDNS_webserver_port=8081
      - PDNS_default_ttl=3600
    restart: unless-stopped

volumes:
  gozone_data:
