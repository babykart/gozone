name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        # Exclude vendored third-party code, which we don't reformat (the gosec
        # step likewise excludes vendor).
        run: test -z "$(git ls-files '*.go' | grep -v '^vendor/' | xargs -r gofmt -l)"

      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Report coverage
        # Publish the total coverage line to the run/PR check summary and keep
        # the profile downloadable as an artifact (REVIEW.md B-2).
        run: |
          {
            echo '## Test coverage'
            echo '```'
            go tool cover -func=coverage.out | grep '^total:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14

  # Dialect matrix: the full test suite runs against live MySQL and
  # PostgreSQL servers, not just in-memory SQLite. GOZONE_TEST_DB_DRIVER/
  # GOZONE_TEST_DB_DSN redirect testutil.NewTestDB to a per-test database on
  # the service container (requires the `dbmatrix` build tag — see
  # internal/testutil/dbmatrix_on.go); the legacy GOZONE_TEST_*_DSN variables
  # additionally activate the database package's dialect integration tests.
  test-mysql:
    name: Test (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gozone_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      GOZONE_TEST_DB_DRIVER: mysql
      GOZONE_TEST_DB_DSN: root:root@tcp(127.0.0.1:3306)/gozone_test
      GOZONE_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/gozone_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test (full suite on MySQL)
        run: go test -race -count=1 -tags dbmatrix ./...

  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      GOZONE_TEST_DB_DRIVER: postgres
      GOZONE_TEST_DB_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      GOZONE_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test (full suite on PostgreSQL)
        run: go test -race -count=1 -tags dbmatrix ./...

  gosec:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        # No -no-fail: findings must fail the job, otherwise the security
        # gate cannot block a PR. The tree is kept at zero findings;
        # intentional suppressions use documented `#nosec Gxxx` annotations.
        run: gosec -exclude-dir='\.cache|vendor|bin' ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # govulncheck is reachability-based: it fails the job only when code
        # actually calls a vulnerable path. Non-reachable advisories in deps are
        # printed but do not fail the build (exit 0) (REVIEW.md B-2).
        run: govulncheck ./...
